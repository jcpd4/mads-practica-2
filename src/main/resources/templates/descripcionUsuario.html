<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Descripción de usuario')"></head>

<body>
    <!-- Barra de menú condicional -->
    <th:block th:if="${usuario != null}">
        <div th:replace="fragments :: navbar"></div>
    </th:block>
    <th:block th:unless="${usuario != null}">
        <div th:replace="fragments :: navbarNoLogeado"></div>
    </th:block>

    <div class="container-fluid mt-3">
        <div class="row">
            <div class="col-md-6">
                <h2 th:text="'Usuario ' + ${usuarioDescripcion.email}"></h2>
                
                <ul class="list-group mt-3">
                    <li class="list-group-item"><strong>Id:</strong> <span th:text="${usuarioDescripcion.id}"></span></li>
                    <li class="list-group-item"><strong>Email:</strong> <span th:text="${usuarioDescripcion.email}"></span></li>
                    <li class="list-group-item"><strong>Nombre:</strong> <span th:text="${usuarioDescripcion.nombre}"></span></li>
                    <li class="list-group-item"><strong>Fecha de nacimiento:</strong> <span th:text="${#dates.format(usuarioDescripcion.fechaNacimiento, 'dd/MM/yyyy')}"></span></li>
                </ul>
                
                <div class="mt-3">
                    <a class="btn btn-primary" th:href="@{/registrados}">Volver al listado</a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="fragments::javascript"/>
</body>
</html>
