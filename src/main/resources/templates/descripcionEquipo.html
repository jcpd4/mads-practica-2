<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Equipo')"></head>

<body>
    <div th:replace="fragments :: navbar"></div>

    <div class="container-fluid mt-3">
        <h2 th:text="'Equipo ' + ${equipo.nombre}"></h2>
        <div class="alert alert-success mt-3" th:if="${mensaje != null}" th:text="${mensaje}"></div>
        <div class="alert alert-danger mt-3" th:if="${error != null}" th:text="${error}"></div>

        <div class="row mt-3">
            <div class="col">
                <div class="alert alert-info" th:if="${#lists.isEmpty(usuarios)}">
                    Este equipo no tiene miembros.
                </div>

                <table class="table table-striped" th:unless="${#lists.isEmpty(usuarios)}">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.nombre}"></td>
                            <td th:text="${u.email}"></td>
                        </tr>
                    </tbody>
                </table>

                <form method="post" th:action="@{/equipos/{id}/unirse(id=${equipo.id})}"
                      th:unless="${perteneceAlEquipo}" class="d-inline">
                    <button type="submit" class="btn btn-primary">Unirme al equipo</button>
                </form>
                <form method="post" th:action="@{/equipos/{id}/salir(id=${equipo.id})}"
                      th:if="${perteneceAlEquipo}" class="d-inline">
                    <button type="submit" class="btn btn-danger">Salir del equipo</button>
                </form>


                <a class="btn btn-link" th:href="@{/equipos}">Volver al listado de equipos</a>
            </div>
        </div>
    </div>

    <div th:replace="fragments::javascript"/>
</body>
</html>
