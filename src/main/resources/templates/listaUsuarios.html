<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Usuarios registrados')"></head>

<body>
    <!-- Barra de menú condicional (igual que en about.html) -->
    <th:block th:if="${usuario != null}">
        <div th:replace="fragments :: navbar"></div>
    </th:block>
    <th:block th:unless="${usuario != null}">
        <div th:replace="fragments :: navbarNoLogeado"></div>
    </th:block>

    <div class="container-fluid mt-3">
        <h2>Usuarios registrados</h2>
        
        <div class="row mt-3">
            <div class="col">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Email</th>
                            <th>Nombre</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.id}">1</td>
                            <td th:text="${u.email}">user@ua</td>
                            <td th:text="${u.nombre}">User</td>
                            <!-- Celda de estado -->
                            <td th:text="${u.bloqueado} ? 'Bloqueado' : 'Activo'">Activo</td>
                            <td>
                                <!-- Botón Ver (el que ya tenías) -->
                                <a class="btn btn-primary btn-sm" th:href="@{/registrados/{id}(id=${u.id})}">Ver</a>
                                
                                <!-- Botón Bloquear/Habilitar (no se muestra si es admin) -->
                                <form method="post" th:action="@{/registrados/{id}/bloqueo(id=${u.id})}" class="d-inline" th:unless="${u.admin}">
                                    <button type="submit" 
                                            class="btn btn-sm" 
                                            th:classappend="${u.bloqueado} ? 'btn-success' : 'btn-danger'" 
                                            th:text="${u.bloqueado} ? 'Habilitar' : 'Bloquear'">
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="fragments::javascript"/>
</body>
</html>
